<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Arte Open Graph — Luiz Arcanjo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { background: #202d3a; color: #fff; }
    .art { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #202d3a; }
    .portrait { position: absolute; top: 0; right: 0; width: 610px; height: 630px; object-fit: cover; object-position: center 44%; filter: saturate(.75) contrast(1.04) brightness(.88); }
    .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #202d3a 0%, #202d3a 43%, rgba(32,45,58,.94) 50%, rgba(32,45,58,.28) 69%, rgba(32,45,58,.05) 100%); }
    .signature { position: absolute; z-index: 1; top: 18px; left: 60px; width: 258px; height: 200px; object-fit: contain; }
    .rule { position: absolute; z-index: 1; top: 184px; left: 342px; width: 218px; height: 1px; background: rgba(197,160,89,.9); }
    h1 { position: absolute; z-index: 1; top: 260px; left: 70px; width: 530px; margin: 0; font: 800 59px/.99 Manrope, Arial, sans-serif; letter-spacing: -.055em; }
    h1 em { color: #d2ae6c; font: italic 500 68px/.85 "EB Garamond", Georgia, serif; letter-spacing: -.03em; }
    .footer { position: absolute; z-index: 1; bottom: 60px; left: 70px; color: #c5a059; font: 800 14px/1 Manrope, Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="art" role="img" aria-label="Luiz Arcanjo, canções que marcaram gerações">
    <img class="portrait" src="/assets/images/portrait-editorial.jpg" alt="">
    <img class="signature" src="/assets/images/signature-light.png" alt="">
    <span class="rule"></span>
    <h1>Canções que<br>marcaram<br><em>gerações.</em></h1>
    <span class="footer">Música · História · Fé</span>
  </div>
</body>
</html>
